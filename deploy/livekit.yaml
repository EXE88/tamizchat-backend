# کانفیگ LiveKit برای یک سرور کوچک بدون دامنه و بدون TLS.
#
# قبل از اجرا دو جا را عوض کنید:
#   1) keys  — کلید و سکرت خودتان (پایین‌تر توضیح داده شده)
#   2) اگر پشت NAT هستید، بخش external_ip

# پورت سیگنالینگ. کلاینت با ws://<آدرس سرور>:7880 وصل می‌شود.
port: 7880

# لاگ: اگر مدیا وصل نشد، این را روی debug بگذارید.
log_level: info

rtc:
  # یک پورت UDP به‌جای یک رنج بزرگ. برای سرور کوچک بسیار ساده‌تر است:
  # فقط همین یک پورت را در فایروال باز می‌کنید.
  udp_port: 7882

  # مسیر پشتیبان برای شبکه‌هایی که UDP را می‌بندند (بعضی شرکت‌ها و
  # کافی‌نت‌ها). کندتر است ولی اتصال را نجات می‌دهد.
  tcp_port: 7881

  # LiveKit باید آدرسی را در ICE اعلام کند که کلاینت‌ها واقعاً با آن به
  # سرور می‌رسند.
  #
  # روی VPS با آی‌پی عمومی: همین true را بگذارید، خودش پیدا می‌کند.
  # روی سرور خانگی پشت مودم: true را بردارید و آی‌پی عمومی مودم را
  #   دستی بنویسید، و پورت‌ها را روی مودم forward کنید:
  #     use_external_ip: false
  #     node_ip: 85.x.x.x
  # فقط شبکهٔ داخلی (همهٔ دوستان روی همان LAN یا VPN):
  #     use_external_ip: false
  #     node_ip: 192.168.1.50
  use_external_ip: true

# کلید و سکرتی که TamizChat با آن توکن امضا می‌کند.
#
# با این دستور یک جفت بسازید:
#   docker run --rm livekit/livekit-server generate-keys
#
# یا دستی:
#   KEY=API$(openssl rand -hex 6); SECRET=$(openssl rand -base64 32)
#
# همین دو مقدار را در پنل TamizChat هم وارد می‌کنید.
keys:
  APIchangeme: changeme-this-is-not-a-real-secret

# --- فقط برای بات موسیقی ---
# Ingress از طریق Redis با LiveKit حرف می‌زند. اگر بات نمی‌خواهید،
# این بخش را کامنت نگه دارید.
#
# redis:
#   address: 127.0.0.1:6379
