# LiveKit config for a small server with no domain and no TLS.
#
# Change two things before you run it:
#   1) keys  - your own key and secret (explained below)
#   2) the external_ip section, if you are behind NAT

# The signalling port. Clients connect to ws://<server address>:7880.
port: 7880

# Logging: if media will not connect, set this to debug.
log_level: info

rtc:
  # One UDP port instead of a large range. Much simpler for a small server:
  # you open exactly this one port in the firewall.
  udp_port: 7882

  # A fallback path for networks that block UDP (some offices and internet
  # cafes). Slower, but it saves the connection.
  tcp_port: 7881

  # LiveKit has to announce an address in ICE that clients can actually reach
  # the server on.
  #
  # On a VPS with a public IP: leave this true, it will work it out.
  # On a home server behind a router: remove true and write the router's
  #   public IP by hand, and forward the ports on the router:
  #     use_external_ip: false
  #     node_ip: 85.x.x.x
  # LAN only (everyone on the same LAN or VPN):
  #     use_external_ip: false
  #     node_ip: 192.168.1.50
  use_external_ip: true

# The key and secret TamizChat signs tokens with.
#
# Generate a pair with:
#   docker run --rm livekit/livekit-server generate-keys
#
# Or by hand:
#   KEY=API$(openssl rand -hex 6); SECRET=$(openssl rand -base64 32)
#
# You enter these same two values in the TamizChat panel.
keys:
  APIchangeme: changeme-this-is-not-a-real-secret

# --- for the music bot only ---
# Ingress talks to LiveKit through Redis. If you do not want the bot, leave
# this section commented out.
#
# redis:
#   address: 127.0.0.1:6379
