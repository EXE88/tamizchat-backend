# TamizChat - LiveKit and its supporting services
#
# TamizChat itself is not here: that is a binary you run directly. This file
# only brings up the things TamizChat leans on.
#
# It has two profiles:
#   docker compose up -d                     <- LiveKit only (voice and video)
#   docker compose --profile bots up -d      <- plus Redis and Ingress (music bot)
#
# Create a .env file from .env.example before running it.

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: tamizchat-livekit
    restart: unless-stopped
    # host network is required: LiveKit has to announce its real address in ICE
    # and take the UDP port range directly. With bridge, Docker's address
    # translation gets in the way and the media connection never establishes.
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  redis:
    image: redis:7-alpine
    container_name: tamizchat-redis
    restart: unless-stopped
    profiles: [bots]
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no

  # Ingress is only needed for the music bot. It fetches the audio file from
  # TamizChat, transcodes it, and publishes it into the room as a participant.
  ingress:
    image: livekit/ingress:latest
    container_name: tamizchat-ingress
    restart: unless-stopped
    profiles: [bots]
    network_mode: host
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml:ro
    depends_on:
      - redis
      - livekit
