# LiveKit for working on the client's voice and video, on this machine only.
#
#   docker compose -f deploy/docker-compose.livekit.dev.yml up -d
#   docker compose -f deploy/docker-compose.livekit.dev.yml down
#
# It is a separate file from docker-compose.dev.yml on purpose: the backend is
# needed for every phase, LiveKit only for the media ones, and LiveKit is the
# part most likely to need restarting while its config is being tuned.
#
# Bridge networking with published ports, not host networking. See
# livekit.dev.yaml for why that works here and would not work on a real server.

name: tamizchat-livekit-dev

services:
  # Ingress keeps its state in redis and finds LiveKit through it; LiveKit is
  # pointed at the same instance. Without redis the two never see each other and
  # every CreateIngress call times out.
  redis:
    image: redis:7-alpine
    container_name: tamizchat-redis-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: tamizchat-livekit-dev
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # Published on every interface, not pinned to 127.0.0.1, because two
    # different places have to reach LiveKit and they do not agree on a name:
    #
    #   the WinUI client runs on the host       -> 127.0.0.1:7880 works
    #   the backend runs in its own container   -> 127.0.0.1 is *itself*
    #
    # TamizChat has one `livekit.url` setting and derives the server API address
    # from it, so a single name has to satisfy both. That name is
    # host.docker.internal, which resolves from inside a container and on the
    # host — but only reaches a port that is not bound to loopback alone.
    ports:
      - "7880:7880/tcp" # signalling, the ws:// the client connects to
      - "7881:7881/tcp" # ICE over TCP, the no-UDP fallback
      - "7882:7882/udp" # ICE over UDP, where the media actually goes
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7880"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # What actually plays a music bot's audio. TamizChat hands it a URL on the
  # backend and Ingress fetches, transcodes and publishes the track itself —
  # the backend never touches a sample.
  #
  # The URL it fetches comes from `network.public_host`, which in dev must be
  # http://host.docker.internal:8080: "localhost" from inside this container is
  # this container, not the backend.
  ingress:
    image: livekit/ingress:latest
    container_name: tamizchat-ingress-dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    # Ingress shares LiveKit's network namespace on purpose.
    #
    # livekit.dev.yaml announces 127.0.0.1 as the media address, because that is
    # the only address the WinUI client on the host can reach. From a separate
    # container that address is the container itself, so Ingress connected,
    # published nothing, and logged "Failed to ping without candidate pairs" —
    # signalling worked and no audio ever arrived. Sharing the namespace makes
    # 127.0.0.1 mean the same thing on both sides.
    network_mode: "service:livekit"
    environment:
      INGRESS_CONFIG_BODY: |
        log_level: info
        api_key: APIdevtamizchat
        api_secret: devsecret-tamizchat-local-only-do-not-ship-0123456789
        ws_url: ws://127.0.0.1:7880
        redis:
          address: redis:6379
        health_port: 8090
        # Without these, Ingress reports a maximum capacity of zero and refuses
        # every request before it starts — the logs say "url input requirement
        # too low" and nothing else happens.
        cpu_cost:
          rtmp_cpu_cost: 1
          whip_cpu_cost: 1
          whip_bypass_transcoding_cpu_cost: 0.1
          url_cpu_cost: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
