# کانفیگ LiveKit Ingress — فقط برای بات موسیقی لازم است.
#
# Ingress فایل صوتی را از TamizChat می‌گیرد، تبدیل می‌کند و به‌عنوان یک
# شرکت‌کننده در روم پخش می‌کند. اگر بات نمی‌خواهید، این سرویس را اصلاً
# بالا نیاورید.
#
# یادتان باشد بخش redis را در livekit.yaml هم از کامنت دربیاورید،
# وگرنه این دو همدیگر را پیدا نمی‌کنند.

# همان کلید و سکرتی که در livekit.yaml گذاشتید.
api_key: APIchangeme
api_secret: changeme-this-is-not-a-real-secret

# آدرس سیگنالینگ LiveKit. چون هر دو روی همین ماشین‌اند، loopback کافی است.
ws_url: ws://127.0.0.1:7880

# کانال ارتباطی بین Ingress و LiveKit.
redis:
  address: 127.0.0.1:6379

logging:
  level: info

# اندپوینت سلامت، برای اینکه ببینید بالا آمده یا نه:
#   curl http://127.0.0.1:8086
health_port: 8086

# این دو برای حالت‌هایی است که کسی از بیرون به Ingress استریم می‌فرستد
# (مثل OBS). بات ما از این‌ها استفاده نمی‌کند — TamizChat حالت URL_INPUT
# را به کار می‌برد که خودِ Ingress فایل را می‌گیرد. اگر لازم ندارید،
# باز نگه‌داشتنشان روی اینترنت بی‌دلیل است.
rtmp_port: 1935
whip_port: 8085
