# LiveKit Ingress config - only needed for the music bot.
#
# Ingress fetches the audio file from TamizChat, transcodes it, and publishes it
# into the room as a participant. If you do not want the bot, do not bring this
# service up at all.
#
# Remember to uncomment the redis section in livekit.yaml too, or these two will
# never find each other.

# The same key and secret you put in livekit.yaml.
api_key: APIchangeme
api_secret: changeme-this-is-not-a-real-secret

# LiveKit's signalling address. Since both run on this machine, loopback is enough.
ws_url: ws://127.0.0.1:7880

# The channel between Ingress and LiveKit.
redis:
  address: 127.0.0.1:6379

logging:
  level: info

# The health endpoint, so you can check whether it came up:
#   curl http://127.0.0.1:8086
health_port: 8086

# These two are for cases where something outside streams into Ingress (OBS, for
# example). Our bot does not use them - TamizChat uses URL_INPUT mode, where
# Ingress fetches the file itself. If you do not need them, there is no reason to
# leave them open on the internet.
rtmp_port: 1935
whip_port: 8085
